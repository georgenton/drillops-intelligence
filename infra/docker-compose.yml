name: drillops-intelligence
services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    ports:
      - "${POSTGRES_PORT:-5437}:5432"
    environment:
      POSTGRES_USER: drillops
      POSTGRES_PASSWORD: drillops
      POSTGRES_DB: drillops
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U drillops -d drillops"]
      interval: 3s
      timeout: 3s
      retries: 15
    volumes:
      - drillops_pg_data:/var/lib/postgresql/data
volumes:
  drillops_pg_data:
