name: Release container (no deployment)
on:
  workflow_dispatch:
  push:
    branches: [codex/authorized-delivery-oct14]
permissions:
  contents: read
  packages: write
jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with: { version: 10.33.2 }
      - uses: actions/setup-node@v7
        with: { node-version: 24, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint && pnpm typecheck && pnpm test
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        id: image
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: ghcr.io/georgenton/drillops-intelligence:${{ github.sha }}
          build-args: GIT_SHA=${{ github.sha }}
          provenance: true
          sbom: true
      - name: Record immutable image
        run: echo 'ghcr.io/georgenton/drillops-intelligence@${{ steps.image.outputs.digest }}' >> "$GITHUB_STEP_SUMMARY"
